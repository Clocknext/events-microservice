services:
  # Local stand-in for AWS MSK Serverless. Single-broker KRaft (no Zookeeper),
  # PLAINTEXT. Two advertised listeners:
  #   PLAINTEXT  localhost:9092  — the edge (`npm run dev`, on the host)
  #   INTERNAL   kafka:29092     — the ClickHouse container (Kafka table engine),
  #                                which cannot reach the host's localhost.
  # Auto-topic-create is on, so `signals` springs into being on first
  # produce/consume — but `scripts/up.sh` creates it explicitly anyway so the
  # partition count is ours and not the broker default. In prod this is Kafka on
  # the EC2 box with a public SASL_SSL listener — see docs/AWS-SETUP.md §4.
  kafka:
    container_name: kafka
    image: apache/kafka:3.9.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # ONE partition, matching production (docs/AWS-SETUP.md Step 0). Grow to 3
      # only on a measured symptom — see that section for the two triggers.
      #
      # Growing is safe HERE (unlike most Kafka deployments) because nothing in
      # this pipeline reads the topic in order: `signal_log` is
      # ORDER BY (received_at, signal_id) and dedups on `signal_id`. The one real
      # hazard is a new partition starting at the wrong offset, which
      # `kafka_auto_offset_reset = 'earliest'` in 01-schema.sql already prevents.
      # Never LOWER it — that is genuinely impossible.
      KAFKA_NUM_PARTITIONS: 1
      # Single broker: everything replicates once.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ClickHouse ingests from Kafka itself (Kafka table engine + materialized view,
  # see docker/clickhouse/init) — there is no consumer process. It reaches the
  # broker over the compose network at kafka:29092.
  clickhouse:
    container_name: clickhouse
    image: clickhouse/clickhouse-server:25.3
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8123:8123" # HTTP — what `curl` uses
      - "127.0.0.1:9000:9000" # native protocol — clickhouse-client
    environment:
      - CLICKHOUSE_DB=signals
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      # Without this the default user is created without the grants needed to
      # create tables, and the init script fails with a bare "not enough privileges".
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      # Applied on FIRST START ONLY — ClickHouse skips this directory once the
      # data volume exists. `docker compose down -v` to re-apply after an edit.
      - "./docker/clickhouse/init:/docker-entrypoint-initdb.d"
      - "clickhouse-data:/var/lib/clickhouse"
    ulimits:
      # ClickHouse asks for a very high nofile and logs a warning under Docker's
      # default. Not fatal, but it makes the startup log unreadable.
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  clickhouse-data:
